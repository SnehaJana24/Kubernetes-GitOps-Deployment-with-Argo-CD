apiVersion: apps/v1
kind: Deployment

metadata:
  name: devops-gitops-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: devops-gitops-app

  template:
    metadata:
      labels:
        app: devops-gitops-app

    spec:
      containers:
        - name: devops-gitops-app
          image: devops-gitops-app:1.0
          imagePullPolicy: Never

          ports:
            - containerPort: 3000

          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name